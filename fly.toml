# fly.toml app configuration file generated for proches on 2026-08-08T12:07:52+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'proches'
primary_region = 'cdg'

[build]

# Joué dans une machine éphémère, avec les secrets de l'app, **avant** que le
# trafic ne bascule sur la nouvelle version. Une migration qui échoue annule
# donc le déploiement au lieu de mettre en ligne du code qui attend des tables
# absentes — c'est exactement ce qui s'est produit au premier déploiement.
[deploy]
  release_command = "node scripts/migrate.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/connexion'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
